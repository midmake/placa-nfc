name: Read-only plate activation diagnosis
on:
  push:
    branches: [ops/admin-recovery-20261005]
    paths: [.github/workflows/auth-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'midmake/placa-nfc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read plate eligibility only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,urllib.request
          headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"}
          path="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CLOUDFLARE_ACCOUNT_ID"]+"/d1/database/bc6f8a86-9019-4fbb-ba3f-eaaf79d5378e/query"
          sql="""SELECT p.physical_code,p.status,p.blocked,p.owner_id IS NULL AS unassigned,u.role AS owner_role,CASE WHEN lower(u.email)=? THEN 1 ELSE 0 END AS owned_by_requesting_admin,b.name,b.archived_at,b.product,p.establishment_id IS NOT NULL AS linked FROM plates p JOIN batches b ON b.id=p.batch_id LEFT JOIN users u ON u.id=p.owner_id WHERE p.physical_code=?"""
          req=urllib.request.Request(path,headers=headers,data=json.dumps({"sql":sql,"params":["rafael.mkieling@gmail.com","A3009-URRW"]}).encode())
          with urllib.request.urlopen(req,timeout=30) as r: d=json.load(r)
          assert d.get("success"),"Cloudflare query failed"
          print("PLATE_ELIGIBILITY",json.dumps(d["result"][0]["results"]))
          print("READ ONLY; NO WRITES; NO TOKENS OR CUSTOMER DATA")
