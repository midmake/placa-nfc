name: Diagnose ADMIN authentication configuration
on:
  push:
    branches: [ops/admin-recovery-20261005]
    paths: [.github/workflows/auth-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'midmake/placa-nfc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect only binding metadata without secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error
          root="https://api.cloudflare.com/client/v4"
          headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"]}
          def get(path):
           try:
            with urllib.request.urlopen(urllib.request.Request(root+path,headers=headers),timeout=30) as r: d=json.load(r)
            if not d.get("success"): print("ACCESS_DENIED",path.split("?")[0]); return None
            return d["result"]
           except urllib.error.HTTPError as e:
            print("ACCESS_DENIED",e.code,path.split("?")[0]); return None
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          settings=get("/accounts/"+account+"/workers/scripts/placa-nfc/settings")
          if settings:
           b=settings.get("bindings",[])
           print("EMAIL_CONFIGURATION",{"api_key_present":any(x["name"]=="RESEND_API_KEY" for x in b),"from_configured":any(x["name"]=="EMAIL_FROM" for x in b),"reply_to_configured":any(x["name"]=="EMAIL_REPLY_TO" for x in b)})
           print("PRINT_CONFIGURATION",[{k:x.get(k) for k in ("name","type","text")} for x in b if x.get("name") in ["PUBLIC_BASE_URL","QR_PRODUCTION_READY"]])
          zones=get("/zones?name=geargo.com.br")
          if zones: print("TARGET_ZONE",[{k:z.get(k) for k in ("id","name","status")} for z in zones if z.get("name")=="geargo.com.br"])
          domains=get("/accounts/"+account+"/workers/domains")
          if domains: print("TARGET_DOMAIN",[d for d in domains if d.get("hostname")=="app.geargo.com.br"])
          