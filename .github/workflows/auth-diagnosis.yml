name: Connect Gear Go application subdomain
on:
  push:
    branches: [ops/admin-recovery-20261005]
    paths: [.github/workflows/auth-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'midmake/placa-nfc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect only app.geargo.com.br to the existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error
          root="https://api.cloudflare.com/client/v4"
          headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"}
          def call(path, body=None):
           try:
            req=urllib.request.Request(root+path,headers=headers,data=json.dumps(body).encode() if body else None,method="PUT" if body else "GET")
            with urllib.request.urlopen(req,timeout=30) as r: d=json.load(r)
           except urllib.error.HTTPError as e:
            print("CLOUDFLARE_REQUEST_FAILED",e.code); raise SystemExit(1)
           if not d.get("success"): print("CLOUDFLARE_REQUEST_FAILED"); raise SystemExit(1)
           return d["result"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          zones=call("/zones?name=geargo.com.br")
          assert len(zones)==1 and zones[0]["name"]=="geargo.com.br" and zones[0]["status"]=="active", "Zone not active"
          domains=call("/accounts/"+account+"/workers/domains")
          existing=[d for d in domains if d["hostname"]=="app.geargo.com.br"]
          assert not existing or all(d["service"]=="placa-nfc" for d in existing), "Domain belongs to another service"
          if not existing:
           d=call("/accounts/"+account+"/workers/domains",{"hostname":"app.geargo.com.br","service":"placa-nfc","environment":"production","zone_id":zones[0]["id"]})
           assert d["hostname"]=="app.geargo.com.br" and d["service"]=="placa-nfc"
          print("CUSTOM_DOMAIN_ATTACHED app.geargo.com.br -> placa-nfc")
          