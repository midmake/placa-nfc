name: D1 - atualizacao segura V2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: placa-nfc-production-upgrade
  cancel-in-progress: false
jobs:
  validate-and-upgrade:
    if: github.repository == 'midmake/placa-nfc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: midmake/placa-nfc
          ref: 07255b6fc51106e987fc37cbb31ac24247da40ad
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Preflight, recovery point, explicit migrations and verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/production-upgrade.py
      - name: Ready for merge gate
        run: echo "D1 validated. Merge/deploy are separate and must only proceed after this successful run."
